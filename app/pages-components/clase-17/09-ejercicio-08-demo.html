<div class="main__demo">

    <section class="ej-panel">

        <p class="ej-panel__hint">
            Mueve el ratón por el bloque grande y el pequeño. Compara cómo se disparan <kbd>mouseover</kbd> y <kbd>mouseenter</kbd>.
        </p>

        <div class="ej-panel__body ej-panel__body--events">

            <div id="grande" class="caja-grande">
                <span class="caja-grande__label">#grande</span>
                <div id="pequeno" class="caja-pequena">
                    <span class="caja-pequena__label">#pequeno</span>
                </div>
            </div>

            <div class="counters">
                <div class="counters__item">
                    <span class="counters__label">Mouseover</span>
                    <span id="mouseover" class="counters__value">0</span>
                </div>
                <div class="counters__item">
                    <span class="counters__label">Mouseenter</span>
                    <span id="mouseenter" class="counters__value">0</span>
                </div>
            </div>

        </div>

    </section>

</div>
