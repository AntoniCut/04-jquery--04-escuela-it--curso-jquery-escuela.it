<div class="main__demo">


    <div class="tpl">

        <h3 class="tpl__title">
            Handlebars path
        </h3>

        <p class="tpl__hint">
            Accede a datos anidados con <kbd>{{author.id}}</kbd> y <kbd>{{author.name}}</kbd>.
        </p>

        <form class="tpl__form" id="tplForm">

            <div class="tpl__fields">

                <div class="tpl__field">
                    <label class="tpl__label" for="title">Title</label>
                    <input type="text" id="title" class="tpl__input" placeholder="title" autocomplete="off">
                </div>

                <div class="tpl__field">
                    <label class="tpl__label" for="id">Id</label>
                    <input type="text" id="id" class="tpl__input" placeholder="id" autocomplete="off">
                </div>

                <div class="tpl__field">
                    <label class="tpl__label" for="author">Author</label>
                    <input type="text" id="author" class="tpl__input" placeholder="name" autocomplete="off">
                </div>

                <div class="tpl__field">
                    <label class="tpl__label" for="body">Body</label>
                    <input type="text" id="body" class="tpl__input" placeholder="body" autocomplete="off">
                </div>

            </div>

            <div class="tpl__field tpl__field--actions">
                <button type="button" id="myButton" class="tpl__submit">
                    Generar HTML
                </button>
            </div>

        </form>

        <section class="tpl__panel" aria-label="Resultado del template">

            <h4 class="tpl__panel-title">Template Path</h4>

            <div id="myDiv" class="tpl__preview">
                <p class="tpl__preview-placeholder">
                    Aqui se mostrara el HTML generado.
                </p>
            </div>

            <label class="tpl__label" for="myTextarea">Codigo generado</label>
            <textarea id="myTextarea" class="tpl__source" readonly></textarea>

        </section>

        <script id="myTemplate" type="text/x-handlebars-template">
            <h2> Template Path </h2>
            <h3>{{title}}</h3>
            <h4>By: {{author.id}} - {{author.name}}</h4>
            <p>{{body}}</p>
        </script>

    </div>


</div>
