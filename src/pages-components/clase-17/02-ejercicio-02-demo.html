<div class="main__demo">

    <section class="ej-panel">

        <p class="ej-panel__hint">
            Escribe un texto y pulsa Submit. Se creará un DIV con ese contenido y se inyectará debajo.
        </p>

        <div class="ej-panel__body ej-panel__body--form">

            <form action="#" class="ej-form">
                
                <div class="ej-form__field">
                    <label for="texto">Text Input:</label>
                    <input type="text" name="name" id="texto" placeholder="escribe algo" />
                </div>
            
                <div class="ej-form__actions">
                    <input type="submit" value="Submit" class="ej-form__submit" />
                </div>

            </form>

            <div id="salida" class="ej-output">
                <!--*  Aquí se mostrarán los resultados  -->
            </div>

        </div>

    </section>

</div>
